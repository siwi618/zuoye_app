name: Debug - tail backend logs (temporary)

on:
  workflow_dispatch:

jobs:
  tail:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Tail Worker logs for 12 minutes
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: timeout 720 npx -y wrangler@4 tail zuoyebang-backend --format pretty || true
