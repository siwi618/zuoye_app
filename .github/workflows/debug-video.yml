name: Debug - test video moderation (temporary)

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        working-directory: backend
        run: |
          sudo apt-get install -y ffmpeg >/dev/null
          pip install -q .
      - name: Run
        working-directory: backend
        env:
          SUPABASE_URL: http://x
          SUPABASE_ANON_KEY: x
          SUPABASE_SERVICE_ROLE_KEY: x
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          ffmpeg -v error -y -f lavfi -i "color=c=red:s=320x240:d=2" -f lavfi -i "color=c=blue:s=320x240:d=2" -filter_complex "[0][1]concat=n=2:v=1" -c:v libx264 -pix_fmt yuv420p /tmp/t.mp4
          ffmpeg -v error -y -f lavfi -i "color=c=green:s=320x240:d=3" -c:v libvpx -b:v 200k /tmp/t.webm
          python - <<'PY'
          from app.services.moderation import video_frames, check_media
          for p, mime in [("/tmp/t.mp4", "video/mp4"), ("/tmp/t.webm", "video/webm")]:
              d = open(p, "rb").read()
              fr = video_frames(d)
              print(p, "frames", len(fr), "verdict", check_media("video", mime, d))
          print("image verdict", check_media("image", "image/jpeg", video_frames(open("/tmp/t.mp4","rb").read())[0]))
          try:
              video_frames(b"not a video")
          except ValueError as e:
              print("bad video ->", e)
          PY
